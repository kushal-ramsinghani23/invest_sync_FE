@if (authService.isLoggedIn()) {
  <div class="w-full bg-slate-900 border-b border-slate-800 text-right px-6 py-3">
    <button
      (click)="authService.logout()"
      class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 hover:border-rose-500/50 hover:text-rose-300 font-medium text-sm transition-all duration-150 active:scale-95 shadow-sm">
      <!-- Logout Door/Arrow Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span>Log Out</span>
    </button>
  </div>
  <app-dashboard></app-dashboard>
} @else {
  <app-login></app-login>
}
