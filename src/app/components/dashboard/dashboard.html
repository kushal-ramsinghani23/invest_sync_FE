<div class="max-w-3xl mx-auto p-6">
  <h2 class="text-2xl font-bold mb-4">Companies</h2>

  <form (ngSubmit)="onSubmit()" class="flex flex-wrap gap-2 mb-6 bg-gray-50 p-4 rounded-lg">
    <input type="text" [ngModel]="newCompany().name"
            (ngModelChange)="updateNewCompany('name', $event)"
            name="name" placeholder="Company name" required
            class="border rounded px-3 py-2 flex-1 min-w-[150px]" />

    <input type="text" [ngModel]="newCompany().sector"
            (ngModelChange)="updateNewCompany('sector', $event)"
            name="sector" placeholder="Sector"
            class="border rounded px-3 py-2 flex-1 min-w-[120px]" />

    <select [ngModel]="newCompany().stage"
            (ngModelChange)="updateNewCompany('stage', $event)"
            name="stage" class="border rounded px-3 py-2">
      <option value="In Review">In Review</option>
      <option value="Due Diligence">Due Diligence</option>
      <option value="Invested">Invested</option>
      <option value="Passed">Passed</option>
    </select>

    <input type="number" [ngModel]="newCompany().metric_value"
            (ngModelChange)="updateNewCompany('metric_value', +$event)"
            name="metric_value" placeholder="Metric value"
            class="border rounded px-3 py-2 w-32" />

    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
      Add Company
    </button>
  </form>

  @if (companies().length === 0) {
    <p class="text-gray-500">No companies yet.</p>
  } @else {
    <table class="w-full border-collapse bg-white shadow-sm rounded-lg overflow-hidden">
      <thead>
      <tr class="bg-gray-100 text-left">
        <th class="p-3">Name</th>
        <th class="p-3">Sector</th>
        <th class="p-3">Stage</th>
        <th class="p-3">Metric Value</th>
      </tr>
      </thead>
      <tbody>
        @for (company of companies(); track company.id) {
          <tr class="border-t hover:bg-gray-50">
            <td class="p-3">{{ company.name }}</td>
            <td class="p-3">{{ company.sector }}</td>
            <td class="p-3">
              <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800">{{ company.stage }}</span>
            </td>
            <td class="p-3">{{ company.metric_value | number }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
